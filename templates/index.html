{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card p-4">

            <h2 class="fw-bold mb-2">
                Student Behaviour & Performance Prediction
            </h2>

            <p class="text-muted mb-4">
                Predict
                <span class="badge text-bg-primary">Behaviour</span>
                and
                <span class="badge text-bg-success">Performance</span>.

                Login to use the dashboard and save results to history.
            </p>

            <div class="d-flex gap-2">

                <a class="btn btn-primary"
                   href="{{ url_for('login') }}">
                    Login
                </a>

                <a class="btn btn-outline-primary"
                   href="{{ url_for('register') }}">
                    Register
                </a>

            </div>

            <hr class="my-4">

            <p class="mb-0 small text-muted">
                Copy your model files into
                <span class="mono">./models</span>
                before starting the app.
            </p>

        </div>

    </div>

</div>

{% endblock %}
